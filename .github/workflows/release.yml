name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in vMAJOR.MINOR.PATCH format"
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: ${RELEASE_TAG:-<empty>}" >&2
            exit 1
          fi
          package_version=$(node -p "require('./package.json').version")
          tag_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${package_version}." >&2
            exit 1
          fi
          version_code=$(node -e '
            const parts = process.argv[1].split(".").map(Number);
            if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part) || part < 0)) process.exit(1);
            process.stdout.write(String(parts[0] * 1000000 + parts[1] * 1000 + parts[2]));
          ' "$package_version") || {
            echo "package.json version must contain three non-negative numeric components." >&2
            exit 1
          }
          if [ "$version_code" -le 0 ]; then
            echo "Computed Android versionCode is invalid: ${version_code}." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Release tag already exists: ${RELEASE_TAG}" >&2
              exit 1
            fi
          elif [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Push release tag does not match the workflow ref." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "Validated release ${RELEASE_TAG}: package version ${package_version}, Android versionCode ${version_code}."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build web assets
        run: npm run build

  android:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          output_path="${GITHUB_WORKSPACE}/android/release.keystore"
          temporary_path="${output_path}.tmp"
          trap 'rm -f "$temporary_path"' EXIT

          missing_secrets=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            printf 'Required Android signing secrets unavailable to this job: %s\n' \
              "${missing_secrets[*]}" >&2
            echo "Configure them as repository/org secrets, or attach the environment that contains them." >&2
            exit 1
          fi

          umask 077
          normalized_base64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          if ! printf '%s' "$normalized_base64" | base64 --decode > "$temporary_path"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          if [ ! -s "$temporary_path" ]; then
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore file." >&2
            exit 1
          fi
          decoded_base64=$(base64 "$temporary_path" | tr -d '[:space:]')
          if [ "$decoded_base64" != "$normalized_base64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not canonical Base64." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$temporary_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Decoded Android keystore is unreadable, or ANDROID_KEYSTORE_PASSWORD is incorrect." >&2
            exit 1
          fi
          mv "$temporary_path" "$output_path"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Install pinned bundletool
        run: |
          set -euo pipefail
          bundletool_version="1.18.3"
          bundletool_path="${RUNNER_TEMP}/bundletool-all-${bundletool_version}.jar"
          bundletool_url="https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar"
          expected_sha256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

          curl --fail --location --silent --show-error "$bundletool_url" --output "$bundletool_path"
          printf '%s  %s\n' "$expected_sha256" "$bundletool_path" | sha256sum --check --status
          java -jar "$bundletool_path" version
          echo "BUNDLETOOL_PATH=${bundletool_path}" >> "$GITHUB_ENV"

      - name: Install XML validation tools
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libxml2-utils
          fi
          xmllint --version

      - name: Verify and stage Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          apk_path="${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release.apk"
          aab_path="${GITHUB_WORKSPACE}/android/app/build/outputs/bundle/release/app-release.aab"
          version_name=$(node -p "require('./package.json').version")
          version_code=$(node -e '
            const parts = process.argv[1].split(".").map(Number);
            if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part) || part < 0)) process.exit(1);
            process.stdout.write(String(parts[0] * 1000000 + parts[1] * 1000 + parts[2]));
          ' "$version_name") || {
            echo "package.json version must contain three non-negative numeric components." >&2
            exit 1
          }
          staged_apk_path="${GITHUB_WORKSPACE}/release-artifacts/LedgerX-${version_name}.apk"

          for required_path in "$apk_path" "$aab_path"; do
            if [ ! -f "$required_path" ]; then
              echo "Expected Android release output is missing: ${required_path#"$GITHUB_WORKSPACE"/}" >&2
              exit 1
            fi
          done

          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -executable -print 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apksigner_path" ]; then
            echo "Android build-tools apksigner was not found on the runner." >&2
            exit 1
          fi
          if ! "$apksigner_path" verify --verbose --print-certs "$apk_path" >/tmp/ledgerx-apksigner.txt 2>&1; then
            echo "The generated release APK failed apksigner verification." >&2
            exit 1
          fi

          expected_certificate=$(mktemp)
          trap 'rm -f "$expected_certificate"' EXIT
          if ! keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$expected_certificate" >/dev/null 2>&1; then
            echo "Could not export the release certificate from the configured keystore." >&2
            exit 1
          fi
          expected_fingerprint=$(sha256sum "$expected_certificate" | awk '{print tolower($1)}')
          echo "apksigner certificate digest lines:"
          grep -E 'certificate SHA-256 digest:' /tmp/ledgerx-apksigner.txt || true
          actual_fingerprint=$(
            {
              grep -E 'certificate SHA-256 digest:' /tmp/ledgerx-apksigner.txt || true
            } |
              head -n 1 |
              sed -E 's/^.*digest:[[:space:]]*//' |
              tr -d '[:space:]:-' |
              tr '[:upper:]' '[:lower:]'
          )
          expected_length=${#expected_fingerprint}
          actual_length=${#actual_fingerprint}
          expected_valid=false
          actual_valid=false
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]] && expected_valid=true
          [[ "$actual_fingerprint" =~ ^[0-9a-f]{64}$ ]] && actual_valid=true
          echo "Expected certificate digest: ${expected_fingerprint}"
          echo "Actual APK certificate digest: ${actual_fingerprint:-<empty>}"
          echo "Expected digest length/valid: ${expected_length}/${expected_valid}"
          echo "Actual digest length/valid: ${actual_length}/${actual_valid}"
          if [ "$expected_valid" != true ] || [ "$actual_valid" != true ]; then
            echo "Could not determine the release APK certificate fingerprint." >&2
            exit 1
          fi
          if [ "$expected_fingerprint" != "$actual_fingerprint" ]; then
            echo "The release APK certificate does not match the configured release keystore." >&2
            exit 1
          fi

          apkanalyzer_path=$(find "${ANDROID_HOME}" -type f -name apkanalyzer -executable -print 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apkanalyzer_path" ]; then
            echo "Android SDK apkanalyzer was not found on the runner." >&2
            exit 1
          fi
          aab_manifest_path="${RUNNER_TEMP}/ledgerx-aab-manifest.xml"
          if ! java -jar "$BUNDLETOOL_PATH" dump manifest --bundle="$aab_path" > "$aab_manifest_path"; then
            echo "Could not read the Android App Bundle manifest with bundletool." >&2
            exit 1
          fi
          aab_package_id=$(xmllint --xpath 'string(/*/@package)' "$aab_manifest_path" | tr -d '[:space:]')
          aab_version_code=$(xmllint --xpath 'string(/*/@*[local-name()="versionCode"])' "$aab_manifest_path" | tr -d '[:space:]')
          aab_version_name=$(xmllint --xpath 'string(/*/@*[local-name()="versionName"])' "$aab_manifest_path" | tr -d '[:space:]')
          apk_package_id=$("$apkanalyzer_path" manifest application-id "$apk_path" | tr -d '[:space:]')
          apk_version_code=$("$apkanalyzer_path" manifest version-code "$apk_path" | tr -d '[:space:]')
          apk_version_name=$("$apkanalyzer_path" manifest version-name "$apk_path" | tr -d '[:space:]')

          for metadata_name in \
            aab_package_id aab_version_code aab_version_name \
            apk_package_id apk_version_code apk_version_name
          do
            if [ -z "${!metadata_name}" ]; then
              echo "Android release metadata is missing: ${metadata_name}." >&2
              exit 1
            fi
          done

          echo "AAB metadata: package=${aab_package_id}, versionCode=${aab_version_code}, versionName=${aab_version_name}"
          echo "APK metadata: package=${apk_package_id}, versionCode=${apk_version_code}, versionName=${apk_version_name}"
          if [ "$aab_package_id" != "$apk_package_id" ]; then
            echo "Android AAB/APK package ID mismatch." >&2
            exit 1
          fi
          if [ "$aab_version_code" != "$apk_version_code" ]; then
            echo "Android AAB/APK version code mismatch." >&2
            exit 1
          fi
          if [ "$aab_version_name" != "$apk_version_name" ]; then
            echo "Android AAB/APK version name mismatch." >&2
            exit 1
          fi
          if [ "$aab_version_name" != "$version_name" ]; then
            echo "AAB version name ${aab_version_name} does not match package.json version ${version_name}." >&2
            exit 1
          fi
          if [ "$apk_version_name" != "$version_name" ]; then
            echo "APK version name ${apk_version_name} does not match package.json version ${version_name}." >&2
            exit 1
          fi
          if [ "$aab_version_code" != "$version_code" ]; then
            echo "AAB version code ${aab_version_code} does not match expected package.json version code ${version_code}." >&2
            exit 1
          fi
          if [ "$apk_version_code" != "$version_code" ]; then
            echo "APK version code ${apk_version_code} does not match expected package.json version code ${version_code}." >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          cp "$apk_path" "$staged_apk_path"
          echo "Staged signed APK: ${staged_apk_path#"$GITHUB_WORKSPACE"/}"

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-apk
          path: release-artifacts/LedgerX-*.apk
          if-no-files-found: error

  electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron package
        run: npm run electron:build

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-electron-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [android, electron]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be recreated: ${RELEASE_TAG}"
            exit 0
          fi
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=${tag_ref}" \
            -f "sha=${GITHUB_SHA}" >/dev/null; then
            echo "Could not create release tag ${RELEASE_TAG} at commit ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "Created ${tag_ref} at ${GITHUB_SHA}."

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          name: LedgerX ${{ env.RELEASE_TAG }}
          body: Automated release for ${{ env.RELEASE_TAG }}.
          files: release-artifacts/**/*

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          RELEASE_ACTION_URL: ${{ steps.create_release.outputs.url }}
        run: |
          set -euo pipefail
          release_id="${RELEASE_ID}"
          release_action_url="${RELEASE_ACTION_URL}"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Release action returned an invalid release ID: ${release_id:-<empty>}." >&2
            exit 1
          fi
          if ! release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}"); then
            echo "Could not retrieve release ID ${release_id} returned by the release action." >&2
            echo "Release action URL: ${release_action_url:-<empty>}" >&2
            exit 1
          fi
          release_url=$(jq -r '.html_url // empty' <<<"$release_json")
          release_tag=$(jq -r '.tag_name // empty' <<<"$release_json")
          release_draft=$(jq -r '.draft // false' <<<"$release_json")
          asset_names=$(jq -r '[.assets[]?.name] | join(", ")' <<<"$release_json")
          print_release_diagnostics() {
            echo "Release ID: ${release_id}" >&2
            echo "Release tag: ${release_tag:-<empty>}" >&2
            echo "Release URL: ${release_url:-${release_action_url:-<empty>}}" >&2
            echo "Release assets: ${asset_names:-<none>}" >&2
          }
          if [ "$release_tag" != "$RELEASE_TAG" ]; then
            echo "GitHub release tag mismatch: expected ${RELEASE_TAG}, received ${release_tag:-<empty>}." >&2
            print_release_diagnostics
            exit 1
          fi
          if [ "$release_draft" != "true" ]; then
            echo "GitHub release ${RELEASE_TAG} is not a draft." >&2
            print_release_diagnostics
            exit 1
          fi
          asset_count=$(jq '.assets | length' <<<"$release_json")
          if [ "$asset_count" -eq 0 ]; then
            echo "Draft release ${RELEASE_TAG} has no assets." >&2
            print_release_diagnostics
            exit 1
          fi
          required_assets=("app-release.aab" "LedgerX-${RELEASE_TAG#v}.apk")
          for required_asset in "${required_assets[@]}"; do
            if ! jq -e --arg name "$required_asset" '.assets[] | select(.name == $name and (.size | tonumber) > 0)' <<<"$release_json" >/dev/null; then
              echo "Draft release ${RELEASE_TAG} is missing a non-empty asset: ${required_asset}." >&2
              print_release_diagnostics
              exit 1
            fi
          done
          for asset_pattern in '\.AppImage$' '\.exe$'; do
            if ! jq -e --arg pattern "$asset_pattern" '.assets[] | select((.name | test($pattern)) and (.size | tonumber) > 0)' <<<"$release_json" >/dev/null; then
              echo "Draft release ${RELEASE_TAG} is missing a non-empty Electron asset matching ${asset_pattern}." >&2
              print_release_diagnostics
              exit 1
            fi
          done
          echo "Verified ${asset_count} non-empty assets on draft release ${RELEASE_TAG}."
