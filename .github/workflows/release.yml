name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Linux x64'
            platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            is_android: false
          - name: 'Windows'
            platform: 'windows-latest'
            args: '' # Use default Windows target behavior from tauri-action
            is_android: false
          - name: 'Android APK'
            platform: 'ubuntu-22.04'
            args: '--target aarch64-linux-android' # Explicitly for the APK bundle
            is_android: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        if: matrix.is_android != true
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with Android target
        if: matrix.is_android == true
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.is_android != true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java 17
        if: matrix.is_android == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        id: setup-android
        if: matrix.is_android == true
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LedgerX ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
