name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build web assets
        run: npm run build

  android:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          output_path="${GITHUB_WORKSPACE}/android/release.keystore"
          temporary_path="${output_path}.tmp"
          trap 'rm -f "$temporary_path"' EXIT

          missing_secrets=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            printf 'Required Android signing secrets unavailable to this job: %s\n' \
              "${missing_secrets[*]}" >&2
            echo "Configure them as repository/org secrets, or attach the environment that contains them." >&2
            exit 1
          fi

          umask 077
          normalized_base64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          if ! printf '%s' "$normalized_base64" | base64 --decode > "$temporary_path"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          if [ ! -s "$temporary_path" ]; then
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore file." >&2
            exit 1
          fi
          decoded_base64=$(base64 "$temporary_path" | tr -d '[:space:]')
          if [ "$decoded_base64" != "$normalized_base64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not canonical Base64." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$temporary_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Decoded Android keystore is unreadable, or ANDROID_KEYSTORE_PASSWORD is incorrect." >&2
            exit 1
          fi
          mv "$temporary_path" "$output_path"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron package
        run: npm run electron:build

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-electron-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [android, electron]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          name: LedgerX ${{ github.ref_name }}
          body: Automated release for ${{ github.ref_name }}.
          files: release-artifacts/**/*
