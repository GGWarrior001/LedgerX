name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build web assets
        run: npm run build

  android:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          output_path="${GITHUB_WORKSPACE}/android/release.keystore"
          temporary_path="${output_path}.tmp"
          trap 'rm -f "$temporary_path"' EXIT

          missing_secrets=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            printf 'Required Android signing secrets unavailable to this job: %s\n' \
              "${missing_secrets[*]}" >&2
            echo "Configure them as repository/org secrets, or attach the environment that contains them." >&2
            exit 1
          fi

          umask 077
          normalized_base64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          if ! printf '%s' "$normalized_base64" | base64 --decode > "$temporary_path"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          if [ ! -s "$temporary_path" ]; then
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore file." >&2
            exit 1
          fi
          decoded_base64=$(base64 "$temporary_path" | tr -d '[:space:]')
          if [ "$decoded_base64" != "$normalized_base64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not canonical Base64." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$temporary_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Decoded Android keystore is unreadable, or ANDROID_KEYSTORE_PASSWORD is incorrect." >&2
            exit 1
          fi
          mv "$temporary_path" "$output_path"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify and stage Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          apk_path="${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release.apk"
          aab_path="${GITHUB_WORKSPACE}/android/app/build/outputs/bundle/release/app-release.aab"
          version_name=$(node -p "require('./package.json').version")
          staged_apk_path="${GITHUB_WORKSPACE}/release-artifacts/LedgerX-${version_name}.apk"

          for required_path in "$apk_path" "$aab_path"; do
            if [ ! -f "$required_path" ]; then
              echo "Expected Android release output is missing: ${required_path#"$GITHUB_WORKSPACE"/}" >&2
              exit 1
            fi
          done

          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -executable -print 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apksigner_path" ]; then
            echo "Android build-tools apksigner was not found on the runner." >&2
            exit 1
          fi
          if ! "$apksigner_path" verify --verbose --print-certs "$apk_path" >/tmp/ledgerx-apksigner.txt 2>&1; then
            echo "The generated release APK failed apksigner verification." >&2
            exit 1
          fi

          expected_fingerprint=$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null |
            awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          actual_fingerprint=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}' /tmp/ledgerx-apksigner.txt)
          if [ -z "$expected_fingerprint" ] || [ -z "$actual_fingerprint" ]; then
            echo "Could not determine the release APK certificate fingerprint." >&2
            exit 1
          fi
          if [ "$expected_fingerprint" != "$actual_fingerprint" ]; then
            echo "The release APK certificate does not match the configured release keystore." >&2
            exit 1
          fi

          apkanalyzer_path=$(find "${ANDROID_HOME}" -type f -name apkanalyzer -executable -print 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apkanalyzer_path" ]; then
            echo "Android SDK apkanalyzer was not found on the runner." >&2
            exit 1
          fi
          aab_summary=$("$apkanalyzer_path" apk summary "$aab_path")
          apk_summary=$("$apkanalyzer_path" apk summary "$apk_path")
          if [ "$aab_summary" != "$apk_summary" ]; then
            echo "Android AAB/APK package ID, version code, or version name mismatch." >&2
            echo "AAB summary: ${aab_summary}" >&2
            echo "APK summary: ${apk_summary}" >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          cp "$apk_path" "$staged_apk_path"
          echo "Staged signed APK: ${staged_apk_path#"$GITHUB_WORKSPACE"/}"

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-apk
          path: release-artifacts/LedgerX-*.apk
          if-no-files-found: error

  electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron package
        run: npm run electron:build

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-electron-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [android, electron]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          name: LedgerX ${{ github.ref_name }}
          body: Automated release for ${{ github.ref_name }}.
          files: release-artifacts/**/*
