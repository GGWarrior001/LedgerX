name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: "--bundles msi"
            mobile: ""
          - name: Linux
            platform: ubuntu-latest
            args: "--bundles deb,appimage"
            mobile: ""
          - name: Android
            platform: ubuntu-latest
            mobile: "android"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        if: matrix.mobile != 'android'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with Android targets
        if: matrix.mobile == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-latest' && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java 17
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android target
        if: matrix.mobile == 'android'
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init
          fi

      - name: Build Android APK
        if: matrix.mobile == 'android'
        run: npm run tauri android build -- --apk

      - name: Build and upload desktop release assets
        if: matrix.mobile != 'android'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LedgerX ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and upload Android release assets
        if: matrix.mobile == 'android'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LedgerX ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --apk
          mobile: android
