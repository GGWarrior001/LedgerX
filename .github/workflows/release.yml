name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.5.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Build web assets
        run: npm run build

  android:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: npm ci

      - name: Build Electron package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-electron-${{ matrix.os }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [android, electron]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine tag name
        id: tag_info
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag_info.outputs.tag }}
          draft: true
          prerelease: false
          name: LedgerX ${{ steps.tag_info.outputs.tag }}
          body: Automated release for ${{ steps.tag_info.outputs.tag }}.
          files: release-artifacts/*
